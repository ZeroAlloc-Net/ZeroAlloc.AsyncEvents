name: Publish from manifest

# Manual rescue: publishes the release recorded in .release-please-manifest.json when the
# automatic publish did not, for example after a dropped push event or a failed push.
# It runs the same shared workflow as the release itself, against the release tag, so it
# rebuilds exactly the released code even after main has moved on, and it confirms that
# every package reached nuget.org. --skip-duplicate makes re-runs safe.
#
# Usage:
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.AsyncEvents
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.AsyncEvents -f dry-run=true

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, pack and verify only; push nothing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the manifest version and find its tag
        id: manifest
        run: |
          set -euo pipefail
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no \".\" entry"
            exit 1
          fi
          tag="v$version"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::the manifest says $version but tag $tag does not exist; nothing was released to rescue"
            exit 1
          fi
          echo "Rescuing $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      solution: ZeroAlloc.AsyncEvents.slnx
      # Runtimes the tests target, besides the SDK global.json pins.
      dotnet-version: |
        8.0.x
        10.0.x
        11.0.x
      # This repository does not publish to GitHub Packages
      # and attaches its packages to the GitHub release.
      github-packages: false
      release-assets: true
      dry-run: ${{ inputs.dry-run }}
      # nuget.org checks a trusted publisher against the workflow that runs the job, so the push is the
      # push job below, not this reusable workflow.
      push: false

  push:
    needs: [resolve, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Runs as steps of this job, so nuget.org sees this workflow file in the OIDC claim, which is
      # what the trusted publisher policy names. The policy is created by the account in NUGET_USER.
      - uses: ZeroAlloc-Net/.github/.github/actions/nuget-push@main
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}
          nuget-user: ${{ vars.NUGET_USER }}
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          github-packages: false
          release-assets: true

  # The CycloneDX SBOM of the rescued release, as release-please.yml attaches it after a normal release. --clobber
  # in the action replaces an SBOM that is already there. A dry run writes the file and attaches nothing.
  sbom:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the release
        run: dotnet build ZeroAlloc.AsyncEvents.slnx -c Release -p:Version=${{ needs.resolve.outputs.version }}

      - name: Attach the SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: ZeroAlloc.AsyncEvents.slnx
          tag: ${{ needs.resolve.outputs.tag }}
          upload: ${{ !inputs.dry-run }}
